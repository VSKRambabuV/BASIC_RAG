[project]
name = "ragpro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "V S K Rambabu Vudatha", email = "vsvudatha@revealdata.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "pypdf>=6.19.0",
]

[project.scripts]
ragpro = "ragpro:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
]
